[package]
name = "airc"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.9"
colored = "3.0"
regex = "1"
clap = { version = "4", features = ["derive"] }
zip = "2"
chrono = "0.4"
once_cell = "1.19"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"

